name: GPT Changelog (deprecated)
description: Deprecated — use src/changelog/release-notes. Forwards every input and output to it unchanged.

# Kept so existing references keep working after the rename to release-notes. It holds
# no logic of its own: change src/changelog/release-notes instead.

inputs:
  github-token:
    description: GitHub token with contents write and pull-requests write permissions
    required: true
  gpg-private-key:
    description: GPG private key for signing commits
    required: true
  gpg-passphrase:
    description: Passphrase for the GPG private key
    required: true
  git-committer-name:
    description: Git committer name for signed commits
    required: true
  git-committer-email:
    description: Git committer email for signed commits
    required: true
  openrouter-api-key:
    description: OpenRouter API key for release notes generation
    required: true
  filter-paths:
    description: Newline-separated list of path prefixes for monorepo support. Empty means single-app mode.
    required: false
    default: ''
  stable-releases-only:
    description: Only generate changelogs for stable releases (skip beta/rc/alpha tags)
    required: false
    default: 'true'
  release-branch:
    description: Branch whose tags get a changelog. Empty derives it from the run.
    required: false
    default: ''
  openai-model:
    description: Model to use (OpenRouter format). Empty uses the release-notes default.
    required: false
    default: ''
  use-pr-context:
    description: Build the notes from the pull requests in the range. 'false' restores the subject-only prompt.
    required: false
    default: 'true'
  max-context-tokens:
    description: Upper bound, in tokens, for the change list sent to the model.
    required: false
    default: '80000'
  bot-ignore-list:
    description: Additional space-separated GitHub login substrings to treat as bots and exclude from the changelog.
    required: false
    default: ''

outputs:
  has-changes:
    description: Whether the composite identified apps eligible for changelog generation
    value: ${{ steps.release-notes.outputs.has-changes }}
  apps-updated:
    description: Comma-separated list of apps whose CHANGELOGs were updated (empty if none)
    value: ${{ steps.release-notes.outputs.apps-updated }}
  release-line:
    description: Branch the stability gate resolved as this release's line, and the branch the CHANGELOG commit was pushed to.
    value: ${{ steps.release-notes.outputs.release-line }}

runs:
  using: composite
  steps:
    - name: Deprecation notice
      shell: bash
      run: echo "::notice title=gptchangelog::src/changelog/gptchangelog is deprecated; use src/changelog/release-notes (same inputs, with model instead of openai-model)."

    - name: Release notes
      id: release-notes
      uses: LerianStudio/shared-workflows-public/src/changelog/release-notes@v1
      with:
        github-token: ${{ inputs.github-token }}
        gpg-private-key: ${{ inputs.gpg-private-key }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}
        git-committer-name: ${{ inputs.git-committer-name }}
        git-committer-email: ${{ inputs.git-committer-email }}
        openrouter-api-key: ${{ inputs.openrouter-api-key }}
        filter-paths: ${{ inputs.filter-paths }}
        stable-releases-only: ${{ inputs.stable-releases-only }}
        release-branch: ${{ inputs.release-branch }}
        model: ${{ inputs.openai-model }}
        use-pr-context: ${{ inputs.use-pr-context }}
        max-context-tokens: ${{ inputs.max-context-tokens }}
        bot-ignore-list: ${{ inputs.bot-ignore-list }}
