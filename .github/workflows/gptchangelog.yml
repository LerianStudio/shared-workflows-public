name: "GPT Changelog (deprecated)"

# Deprecated — use `release-notes.yml`. This wrapper keeps every input it ever accepted so
# existing callers need no change, and calls `release-notes.yml` with them.
# `openai_model` becomes `model`; `runner_type`, `shared_paths` and `path_level` were already
# no-ops and are dropped here.

on:
  workflow_call:
    inputs:
      runner_type:
        description: 'Deprecated, ignored. Runner comes from org variables.'
        type: string
        default: ''
      filter_paths:
        description: 'Newline-separated list of path prefixes to filter. If not provided, treats as single app repo.'
        type: string
        required: false
        default: ''
      shared_paths:
        description: 'DEPRECATED — no-op. Kept for compatibility.'
        type: string
        required: false
        default: ''
      path_level:
        description: 'DEPRECATED — no-op. Kept for compatibility.'
        type: string
        default: '2'
      stable_releases_only:
        description: 'Only generate changelogs for stable releases (skip beta/rc/alpha tags)'
        type: boolean
        default: true
      openai_model:
        description: 'Model to use (OpenRouter format). Passed to release-notes.yml as `model`; empty uses the CHANGELOG_MODEL variable, then anthropic/claude-sonnet-5.5.'
        type: string
        default: ''
      max_context_tokens:
        description: 'Upper bound, in tokens, for the change list sent to the model.'
        type: string
        default: '80000'
      use_pr_context:
        description: 'Build the notes from the pull requests in the range instead of commit subjects only. false restores the subject-only prompt.'
        type: boolean
        default: true
      changelog_release_branch:
        description: 'Branch whose tags get a changelog. Empty derives it from the run.'
        type: string
        required: false
        default: ''
      bot_ignore_list:
        description: 'Additional space-separated GitHub login substrings to treat as bots and exclude from the changelog.'
        type: string
        required: false
        default: ''
      backmerge_enabled:
        description: 'Backmerge the release line into backmerge_target after the CHANGELOG is committed.'
        type: boolean
        default: true
      backmerge_target:
        description: 'Branch to backmerge the release line into.'
        type: string
        default: 'develop'

permissions:
  contents: write
  pull-requests: write

jobs:
  release_notes:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-notes.yml
    with:
      filter_paths: ${{ inputs.filter_paths }}
      stable_releases_only: ${{ inputs.stable_releases_only }}
      model: ${{ inputs.openai_model }}
      max_context_tokens: ${{ inputs.max_context_tokens }}
      use_pr_context: ${{ inputs.use_pr_context }}
      changelog_release_branch: ${{ inputs.changelog_release_branch }}
      bot_ignore_list: ${{ inputs.bot_ignore_list }}
      backmerge_enabled: ${{ inputs.backmerge_enabled }}
      backmerge_target: ${{ inputs.backmerge_target }}
    secrets: inherit
