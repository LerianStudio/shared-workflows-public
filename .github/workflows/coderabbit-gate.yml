name: CodeRabbit Gate

# Deprecated no-op. CodeRabbit was removed from the organization on 2026-11-10 and
# Radagast reviews pull requests, so nothing posts `@coderabbitai review` any more.
# The file and its inputs stay so a caller that still references it keeps working.
# See docs/coderabbit-gate.md.

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: true
        type: number
      checks_passed:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false
        type: boolean
        default: false
      head_sha:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: true
        type: string
      review_base_branches:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false
        type: string
        default: develop
      review_head_patterns:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false
        type: string
        default: hotfix/*
      ignore_authors:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false
        type: string
        default: dependabot[bot]
      label:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false
        type: string
        default: review-ready
      dry_run:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false
        type: boolean
        default: false
      runner_type:
        description: 'Deprecated, ignored. Runner comes from org variables.'
        required: false
        type: string
        default: ''
    secrets:
      MANAGE_TOKEN:
        description: 'Deprecated, ignored. CodeRabbit was removed from the organization.'
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: Request CodeRabbit Review
    runs-on: ${{ (github.event.repository.visibility == 'public' && vars.PUBLIC_RUNNERS) || (github.event.repository.visibility != 'public' && vars.LIGHT_RUNNERS) || vars.GENERAL_RUNNERS || vars.FALLBACK_RUNNERS }}
    steps:
      - name: Deprecated
        run: echo "::notice::coderabbit-gate.yml is deprecated and does nothing. CodeRabbit was removed from the organization; Radagast reviews pull requests. Remove this job from the caller."
