name: Self — PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  # ----------------- PR Validation -----------------
  validation:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    uses: ./.github/workflows/pr-validation.yml
    with:
      # Trunk-based: every branch opens its pull request straight into main, so
      # there is no promotion source to enforce.
      enforce_source_branches: false
      # Stated rather than left to the default: this repository is the first
      # consumer of its own gate, and the `breaking-approval` Environment lives
      # here. If it is ever removed, the preflight fails loudly instead of this
      # line quietly meaning nothing.
      enable_breaking_change_approval: true
      # Trunk-based: every pull request lands on main, so every one of them is
      # what the next release is cut from. The default scope gates only hotfix/*
      # into main because it assumes the rest was gated on the way into develop.
      breaking_change_scope_rules: '{"main": "*"}'
    secrets:
      MANAGE_TOKEN: ${{ secrets.MANAGE_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ----------------- Changed Files Detection -----------------
  changed-files:
    name: Detect Changed Files
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      yaml_files: ${{ steps.detect.outputs.yaml-files }}
      workflow_files: ${{ steps.detect.outputs.workflow-files }}
      action_files: ${{ steps.detect.outputs.action-files }}
      composite_files: ${{ steps.detect.outputs.composite-files }}
      markdown_files: ${{ steps.detect.outputs.markdown-files }}
      all_files: ${{ steps.detect.outputs.all-files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Detect changed files
        id: detect
        uses: ./src/config/changed-workflows
        with:
          github-token: ${{ github.token }}

  # ----------------- Branch Test Instructions -----------------
  # There is no develop branch: a change is tested before merge by referencing
  # the pull request's own branch from a caller repository. This job keeps a
  # single comment on the pull request naming that branch and listing the
  # reusable workflows and composites it changes. Fork branches do not exist in
  # this repository, so the comment says so instead of offering a ref.
  branch-test-instructions:
    name: Branch Test Instructions
    needs: changed-files
    if: github.event_name == 'pull_request' && needs.changed-files.result == 'success'
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post branch test instructions
        # A fork's token cannot write comments; the instructions are advisory, so
        # that must not fail the run.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED_FILES: ${{ needs.changed-files.outputs.all_files }}
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          script: |
            const marker = '<!-- branch-test-instructions -->';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const headRef = process.env.HEAD_REF;
            const isFork = process.env.HEAD_REPO !== repo;
            const files = (process.env.CHANGED_FILES || '').split(/\s+/).filter(Boolean);

            const workflows = [...new Set(files
              .filter(f => /^\.github\/workflows\/[^/]+\.yml$/.test(f))
              .filter(f => !/^\.github\/workflows\/self-/.test(f)))].sort();
            const composites = [...new Set(files
              .map(f => f.match(/^(src\/[^/]+\/[^/]+)\//))
              .filter(Boolean)
              .map(m => m[1]))].sort();

            const modules = [...workflows, ...composites];
            let body = `${marker}\n## 🧪 Testar esta PR\n\n`;
            if (isFork) {
              body += 'Esta PR vem de um fork: a branch dela não existe neste repositório, então não pode ser referenciada para teste.\n';
            } else {
              body += `Para testar, referencie a branch desta PR: \`@${headRef}\`\n`;
            }
            if (modules.length) {
              body += '\n**Módulos alterados:**\n' + modules.map(m => `- \`${m}\``).join('\n') + '\n';
            }

            const { owner, repo: name } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo: name, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo: name, comment_id: existing.id, body });
              }
            } else {
              await github.rest.issues.createComment({ owner, repo: name, issue_number, body });
            }

  # ----------------- Breaking Change Guard Detector Tests -----------------
  breaking-change-guard-tests:
    name: Breaking Change Guard Detector Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # test-workflow.py imports yaml. Without this the job depends on the
      # runner image happening to ship PyYAML, and `runner_type` is
      # configurable — the same reasoning as the workflow-secrets job below,
      # which was already doing this.
      - name: Install dependencies
        run: |
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi

      - name: Run breaking-change detector matrix
        run: bash src/validate/breaking-change-guard/test.sh

      - name: Run breaking-change workflow integration tests
        run: python3 src/validate/breaking-change-guard/test-workflow.py

      # The composites the gate is built from. Each ships a suite and none of
      # them were invoked by any workflow — 76 cases, including the
      # output-forgery and fingerprint ones, that a change could silently walk
      # past. A suite nobody runs is documentation.
      - name: Run gate-scope resolver tests
        run: bash src/validate/pr-gate-scope/test.sh

      - name: Run breaking-change commit-list tests
        run: bash src/validate/breaking-change-commits/test.sh

      - name: Run CODEOWNERS reviewer tests
        run: bash src/validate/codeowners-reviewers/test.sh

  # ----------------- GitOps Chart Tooling Tests -----------------
  gitops-chart-tooling-tests:
    name: GitOps Chart Tooling Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Run GitOps chart tooling regression tests
        run: |
          python3 -m venv "${RUNNER_TEMP}/gitops-chart-tooling-tests"
          "${RUNNER_TEMP}/gitops-chart-tooling-tests/bin/pip" install 'PyYAML==6.0.2'
          "${RUNNER_TEMP}/gitops-chart-tooling-tests/bin/python" src/deploy/gitops-chart-update/test-tooling.py

  # ----------------- Commit Signature Validation Tests -----------------
  pr-commit-signatures-tests:
    name: Commit Signature Validation Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run pr-commit-signatures behavioural tests
        run: python3 src/validate/pr-commit-signatures/test.py

  # ----------------- CodeRabbit Collapse Tests -----------------
  coderabbit-collapse-tests:
    name: CodeRabbit Collapse Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run coderabbit-collapse behavioural tests
        run: python3 src/notify/coderabbit-collapse/test.py

  # ----------------- CodeRabbit Gate Tests -----------------
  coderabbit-gate-tests:
    name: CodeRabbit Gate Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # The shellcheck job lints `run:` blocks inside YAML, not standalone scripts.
      - name: Lint coderabbit-gate test scripts
        run: shellcheck tests/coderabbit-gate/*.sh

      - name: Run coderabbit-gate author veto tests
        run: bash tests/coderabbit-gate/test-workflow.sh

  # ----------------- Non-Doc Changes Gate Tests -----------------
  non-doc-changes-tests:
    name: Non-Doc Changes Gate Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run non-doc-changes classification tests
        run: python3 src/config/non-doc-changes/test.py

  # ----------------- Workflow Secrets Contract Tests -----------------
  workflow-secrets-contract-tests:
    name: Workflow Secrets Contract Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # test.py shells out to check.py, which imports yaml. Without this the
      # job depends on the runner image happening to ship PyYAML — and the
      # failure would be misleading: the cases asserting exit 1 would still
      # pass, since an ImportError exits 1 too.
      - name: Install dependencies
        run: |
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi

      - name: Run workflow-secrets-contract tests
        run: python3 src/lint/workflow-secrets-contract/test.py

  # ----------------- YAML Lint -----------------
  yamllint:
    name: YAML Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.yaml_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: YAML Lint
        uses: ./src/lint/yamllint
        with:
          file-or-dir: ${{ needs.changed-files.outputs.yaml_files }}

  # ----------------- Action Lint -----------------
  actionlint:
    name: Action Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.workflow_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Action Lint
        uses: ./src/lint/actionlint
        with:
          files: ${{ needs.changed-files.outputs.workflow_files }}

  # ----------------- Pinned Actions Check -----------------
  pinned-actions:
    name: Pinned Actions Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Pinned Actions Check
        uses: ./src/lint/pinned-actions
        with:
          files: ${{ needs.changed-files.outputs.action_files }}

  # ----------------- CodeQL Action Version Consistency -----------------
  codeql-action-versions:
    name: CodeQL Action Version Consistency
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: CodeQL Action Version Check
        uses: ./src/lint/codeql-action-version-check

  # ----------------- Workflow Secrets Contract -----------------
  # Global like the CodeQL version check above, not gated on changed files: a
  # violation can be introduced by editing the *called* workflow — adding a
  # secret to its contract leaves every caller short one — so a run that only
  # looked at the diff would miss it.
  workflow-secrets-contract:
    name: Workflow Secrets Contract
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Workflow Secrets Contract Lint
        uses: ./src/lint/workflow-secrets-contract

  # ----------------- Markdown Link Check -----------------
  markdown-link-check:
    name: Markdown Link Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.markdown_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Markdown Link Check
        uses: ./src/lint/markdown-link-check
        with:
          file-path: ${{ needs.changed-files.outputs.markdown_files }}

  # ----------------- Spelling Check -----------------
  typos:
    name: Spelling Check
    needs: changed-files
    if: needs.changed-files.outputs.all_files != ''
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Spelling Check
        uses: ./src/lint/typos
        with:
          files: ${{ needs.changed-files.outputs.all_files }}

  # ----------------- Shell Check -----------------
  shellcheck:
    name: Shell Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Shell Check
        uses: ./src/lint/shellcheck
        with:
          files: ${{ needs.changed-files.outputs.action_files }}

  # ----------------- README Check -----------------
  readme-check:
    name: README Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: README Check
        uses: ./src/lint/readme-check
        with:
          files: ${{ needs.changed-files.outputs.action_files }}

  # ----------------- Composite Schema Lint -----------------
  composite-schema:
    name: Composite Schema Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.composite_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Composite Schema Lint
        uses: ./src/lint/composite-schema
        with:
          files: ${{ needs.changed-files.outputs.composite_files }}

  # ----------------- Deployment Matrix Lint -----------------
  deployment-matrix:
    name: Deployment Matrix Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: contains(needs.changed-files.outputs.all_files, 'config/deployment-matrix.yml')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Deployment Matrix Lint
        uses: ./src/lint/deployment-matrix
        with:
          manifest-file: config/deployment-matrix.yml

  # ----------------- CodeQL Analysis -----------------
  codeql:
    name: CodeQL Analysis
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Generate CodeQL config for changed files
        id: codeql-config
        uses: ./src/security/codeql-config
        with:
          changed-paths: ${{ needs.changed-files.outputs.action_files }}

      - name: Initialize CodeQL
        if: steps.codeql-config.outputs.skip != 'true'
        uses: ./src/security/codeql-init
        with:
          languages: actions
          config-file: ${{ steps.codeql-config.outputs.config-file }}

      - name: Perform CodeQL Analysis
        if: steps.codeql-config.outputs.skip != 'true'
        uses: ./src/security/codeql-analyze
        with:
          category: '/language:actions'
          upload: 'true'

      - name: Post CodeQL Results to PR
        if: always() && github.event_name == 'pull_request' && steps.codeql-config.outputs.skip != 'true'
        uses: ./src/security/codeql-reporter
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          languages: actions

  # ----------------- Lint Report -----------------
  lint-report:
    name: Lint Report
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      checks: read
    needs: [changed-files, yamllint, actionlint, pinned-actions, markdown-link-check, typos, shellcheck, readme-check, composite-schema, deployment-matrix]
    if: always() && github.event_name == 'pull_request' && needs.changed-files.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Post Lint Report
        uses: ./src/notify/pr-lint-reporter
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          yamllint-result: ${{ needs.yamllint.result }}
          yamllint-files: ${{ needs.changed-files.outputs.yaml_files }}
          actionlint-result: ${{ needs.actionlint.result }}
          actionlint-files: ${{ needs.changed-files.outputs.workflow_files }}
          pinned-actions-result: ${{ needs.pinned-actions.result }}
          pinned-actions-files: ${{ needs.changed-files.outputs.action_files }}
          markdown-result: ${{ needs.markdown-link-check.result }}
          markdown-files: ${{ needs.changed-files.outputs.markdown_files }}
          typos-result: ${{ needs.typos.result }}
          typos-files: ${{ needs.changed-files.outputs.all_files }}
          shellcheck-result: ${{ needs.shellcheck.result }}
          shellcheck-files: ${{ needs.changed-files.outputs.action_files }}
          readme-result: ${{ needs.readme-check.result }}
          readme-files: ${{ needs.changed-files.outputs.action_files }}
          composite-schema-result: ${{ needs.composite-schema.result }}
          composite-schema-files: ${{ needs.changed-files.outputs.composite_files }}
          deployment-matrix-result: ${{ needs.deployment-matrix.result }}
          deployment-matrix-files: ${{ contains(needs.changed-files.outputs.all_files, 'config/deployment-matrix.yml') && 'config/deployment-matrix.yml' || '' }}


  # ----------------- CodeRabbit Gate -----------------
  # This repository's review scope, declared here rather than buried in the gate.
  #
  # Trunk-based: main is the only base branch, so every pull request into main
  # gets a CodeRabbit review. The head-pattern dimension is cleared because the
  # base already covers every branch.
  #
  # Bounded by this workflow's own `on.pull_request.branches` above: a base branch
  # named here but missing from that list never triggers a run, so the label never
  # arrives. Add it in both places to widen the scope.
  #
  # The gate runs in `release` mode only: the label is granted once, when the pull
  # request first goes green, and is never taken back. Subsequent pushes still run
  # this job, find the label already present, and change nothing.
  #
  # The `withdraw` mode exists in the reusable workflow and is deliberately unused
  # here. It would make every revision re-earn the label, but measurement showed
  # the guarantee it promises does not hold: CodeRabbit decides at the moment of
  # the event and publishes minutes later, so withdrawing afterwards cannot cancel
  # a decision already taken. On PR #705 the push landed at 14:09:38, the
  # withdrawal at 14:09:59 — 21 seconds late — and the review was published at
  # 14:15:23 regardless. It won the race on PR #708 and lost it on #705, so what
  # it buys is a probability, at the cost of a label add/remove pair on the
  # timeline for every push. Not worth it here.
  #
  # The logic lives in .github/workflows/coderabbit-gate.yml — see docs/coderabbit-gate.md.
  release-coderabbit:
    name: Release CodeRabbit Review
    needs:
      - validation
      - changed-files
      - breaking-change-guard-tests
      - pr-commit-signatures-tests
      - coderabbit-collapse-tests
      - coderabbit-gate-tests
      - non-doc-changes-tests
      - yamllint
      - actionlint
      - pinned-actions
      - codeql-action-versions
      - workflow-secrets-contract
      - workflow-secrets-contract-tests
      - markdown-link-check
      - typos
      - shellcheck
      - readme-check
      - composite-schema
      - deployment-matrix
      - codeql
    # `always()` so skipped lints (no matching files changed) do not block the
    # gate; the `checks_passed` input below carries the real verdict. Draft PRs
    # are excluded — `drafts: false` in .coderabbit.yml makes the label inert
    # there anyway.
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/coderabbit-gate.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      # A required check failing or being cancelled withholds the label; skipped
      # is fine, since most lints are conditional on the file types touched.
      checks_passed: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      # Binds the verdict above to the commit it was computed for, so a run
      # superseded by a newer push cannot authorise a head it never validated.
      head_sha: ${{ github.event.pull_request.head.sha }}
      review_base_branches: main
      review_head_patterns: ''
    secrets:
      MANAGE_TOKEN: ${{ secrets.MANAGE_TOKEN }}
